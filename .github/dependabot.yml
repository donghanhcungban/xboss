version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Mọi bước github/codeql-action (init/analyze/upload-sarif) phải cùng phiên bản, nếu không
    # CodeQL đỏ "Loaded a configuration file for version X, but running version Y" — gom một PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
